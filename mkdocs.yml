site_name: QWINSTA
site_description: windows / network / vpn / real ops
site_url: https://qwinsta.ru

theme:
  name: material
  language: ru
  palette:
    scheme: slate
    primary: black
    accent: green
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Главная: index.md
  - Windows: windows/index.md
  - MikroTik: mikrotik/index.md
  - VPN: vpn/index.md
  - Toolkit: toolkit/index.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables

extra:
  generator: false