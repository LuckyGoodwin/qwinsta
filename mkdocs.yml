site_name: "Q:\\>qwinsta_"
site_url: https://qwinsta.ru/

theme:
  name: material
  language: ru
  font: false

  icon:
    logo: material/console

  palette:
    scheme: slate
    primary: black
    accent: green

  features:
    - navigation.sections
    - toc.follow
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

nav:
  - "Главная": index.md
  - "VPN и прокси":
      - "OpenVPN на Windows Server 2022": vpn/openvpn/install-windows-server.md
      - "WireGuard между MikroTik": vpn/wireguard/wireguard-site-to-site-mikrotik.md
      - "Xray, REALITY и Caddy": vpn/xray/xray-reality.md
      - "MTProxy для Telegram": vpn/mtproxy/fake-tls.md
      - "Tinyproxy HTTP-прокси": vpn/tinyproxy/install.md
  - "Windows":
      - "RDP: ошибка 0x4 и сертификат TLS": windows/rdp/event-id-4625.md
  - "Документация":
      - "GitHub Pages и MkDocs": github-pages-mkdocs.md
